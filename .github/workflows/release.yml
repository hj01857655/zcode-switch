name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    name: Build & Release (${{ matrix.os }} · ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64：NSIS，native runner 默认 target
          - os: windows-latest
            bundles: nsis
            arch: x64
          # Windows ARM64：交叉编译（--target），依赖 runner 镜像的 MSVC ARM64 组件；
          # 单条腿失败不影响其它腿（fail-fast: false）
          - os: windows-latest
            bundles: nsis
            arch: arm64
            rust_target: aarch64-pc-windows-msvc
          # macOS Apple Silicon：macos-latest 原生即 arm64；app 产出更新器要的 .app.tar.gz，dmg 仍给用户装
          - os: macos-latest
            bundles: app,dmg
            arch: aarch64
          # macOS Intel：强制 x86_64 target
          - os: macos-latest
            bundles: app,dmg
            arch: x64
            rust_target: x86_64-apple-darwin
          # Linux amd64：deb + appimage，native
          - os: ubuntu-22.04
            bundles: deb,appimage
            arch: amd64
          # Linux arm64：GitHub 原生 ARM runner，apt 依赖与 x64 同名（解析到 arm64 包）
          - os: ubuntu-24.04-arm
            bundles: deb,appimage
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri & upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 应用内更新签名私钥（minisign，无口令）；缺失时 updater 产物 latest.json 无法生成
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          # Windows 只出 NSIS，latest.json 里指向 *-setup.exe 而非默认的 msi
          releaseName: 'Z·SWITCH ${{ github.ref_name }}'
          releaseBody: |
            见 [README](https://github.com/${{ github.repository }}/blob/main/README.md) 了解完整功能。

            ## 下载

            - **Windows**：`*_x64-setup.exe`（x64）／`*_arm64-setup.exe`（ARM64）安装包；`*_portable.exe` 便携版
            - **macOS**：`*_aarch64.dmg`（Apple 芯片）／`*_x64.dmg`（Intel 芯片）
            - **Linux**：`*amd64.deb`／`*arm64.deb`／`*.AppImage`

            ## 未签名提示

            - Windows：SmartScreen 选「更多信息 → 仍要运行」
            - macOS：Gatekeeper 右键打开
            - Linux：AppImage 需 `chmod +x`

            SHA-256 校验和见各 `checksums-*.txt`。
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          updaterJsonPreferNsis: true
          args: --bundles ${{ matrix.bundles }} ${{ matrix.rust_target && format('--target {0}', matrix.rust_target) || '' }}

      - name: Upload portable exe + checksums (windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUST_TARGET: ${{ matrix.rust_target }}
          ARCH: ${{ matrix.arch }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # 指定 --target 时产物在 target/<triple>/release，native 时在 target/release
          if [ -n "$RUST_TARGET" ]; then BUILD_DIR="src-tauri/target/$RUST_TARGET/release"; else BUILD_DIR="src-tauri/target/release"; fi
          cp "$BUILD_DIR/zcode-switch.exe" "zcode-switch_${VER}_${ARCH}_portable.exe"
          SETUP=$(ls "$BUILD_DIR"/bundle/nsis/*-setup.exe | head -1)
          sha256sum "zcode-switch_${VER}_${ARCH}_portable.exe" "$SETUP" | sed 's| .*/| |' > "checksums-Windows-${ARCH}-${GITHUB_REF_NAME}.txt"
          gh release upload "$GITHUB_REF_NAME" "zcode-switch_${VER}_${ARCH}_portable.exe" "checksums-Windows-${ARCH}-${GITHUB_REF_NAME}.txt" --clobber

      - name: Upload checksums
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.arch }}
        run: |
          # 用 arch 标签命名：mac 两腿（aarch64/x64）与 linux 两腿（amd64/arm64）互不撞名
          find src-tauri/target -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) \
            | xargs sha256sum | sed 's| .*/| |' > "checksums-${RUNNER_OS}-${ARCH}-${GITHUB_REF_NAME}.txt"
          gh release upload "$GITHUB_REF_NAME" "checksums-${RUNNER_OS}-${ARCH}-${GITHUB_REF_NAME}.txt" --clobber
